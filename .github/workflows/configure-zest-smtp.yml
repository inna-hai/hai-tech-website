name: Configure Zest SMTP and send test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure deployment SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ZEST_SMTP_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ZEST_SMTP_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/zest-smtp-deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/zest-smtp-deploy" "$HOME/.ssh/known_hosts"

      - name: Install SMTP secret and send one test email
        env:
          SMTP_APP_PASSWORD: ${{ secrets.ZEST_SMTP_APP_PASSWORD }}
          DEPLOY_HOST: ${{ vars.ZEST_SMTP_HOST }}
          DEPLOY_USER: ${{ vars.ZEST_SMTP_USER }}
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/zest-smtp-deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          printf '%s' "$SMTP_APP_PASSWORD" | "${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            'python3 /home/ameidar/restaurant-crm/scripts/configure_smtp_secret.py'
          "${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            'systemctl --user restart restaurant-crm.service; sleep 4; systemctl --user is-active restaurant-crm.service cloudflared-seatly.service; curl --fail --silent --show-error http://localhost:3170/api/health >/dev/null; python3 /home/ameidar/restaurant-crm/scripts/send_smtp_test.py'

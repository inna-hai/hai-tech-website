name: Deploy Seatly proxy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/seatly-proxy/**"
      - ".github/workflows/deploy-seatly-proxy.yml"

permissions:
  contents: read

concurrency:
  group: deploy-seatly-proxy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy Cloudflare Worker
        run: npx --yes wrangler@4.102.0 deploy --config workers/seatly-proxy/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
